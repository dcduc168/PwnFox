<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="./settings.css">
    <script defer src="/src/config.js"></script>
    <script defer src="/src/colors.js"></script>
    <script defer src="./settings.js"></script>
</head>
<body>
    <section>
        <h2>Proxies</h2>
        <div id="proxyList" class="proxy-list"></div>
        <form id="proxyForm" class="proxy-add-row">
            <label>Name<input type="text" id="newProxyTitle" autocomplete="off" required></label>
            <label>Host<input type="text" id="newProxyHost" autocomplete="off" required></label>
            <label>Port<input type="number" id="newProxyPort" min="1" max="65535" required></label>
            <button class="primary" type="submit">Add proxy</button>
        </form>
    </section>

    <section>
        <h2>Container proxy</h2>
        <p class="hint">Private Browsing appears after “Run in Private Windows” is enabled for PwnFox in about:addons.</p>
        <div id="contextAssignments" class="context-assignment-list"></div>
    </section>

    <section>
        <h2>Toolbox scripts</h2>
        <div id="savedToolbox" class="file-list">
            <div class="file-list-head">
                <select aria-label="Toolbox script"></select>
                <button class="file-list-new" type="button">New</button>
                <button class="file-list-edit" type="button">Rename</button>
                <button class="file-list-save primary" type="button">Save</button>
                <button class="file-list-delete danger" type="button">Delete</button>
            </div>
            <textarea disabled spellcheck="false" autocomplete="off" aria-label="Toolbox source"></textarea>
        </div>
    </section>
</body>
</html>
