<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark light">
    <link rel="stylesheet" href="./settings.css">
    <script defer src="/src/config.js"></script>
    <script defer src="/src/colors.js"></script>
    <script defer src="./settings.js"></script>
</head>
<body>
    <section>
        <h2>Proxies</h2>
        <div id="proxyList" class="proxy-list"></div>
        <div class="proxy-add-row">
            <input class="browser-style" type="text" id="newProxyTitle" placeholder="Name" aria-label="Proxy name">
            <input class="browser-style" type="text" id="newProxyHost" placeholder="Host" aria-label="Proxy host">
            <input class="browser-style" type="number" id="newProxyPort" placeholder="Port" aria-label="Proxy port" min="1" max="65535">
            <button class="browser-style" type="button" id="addProxy">Add</button>
        </div>
    </section>

    <section>
        <h2>Container proxy</h2>
        <p class="hint">Private Browsing appears after “Run in Private Windows” is enabled for PwnFox in about:addons.</p>
        <div id="contextAssignments" class="context-assignment-list"></div>
    </section>

    <section>
        <h2>Toolbox scripts</h2>
        <div id="savedToolbox" class="file-list">
            <div class="file-list-head">
                <select class="browser-style" aria-label="Toolbox script"></select>
                <button class="file-list-new browser-style" type="button">New</button>
                <button class="file-list-edit browser-style" type="button">Rename</button>
                <button class="file-list-save browser-style" type="button">Save</button>
                <button class="file-list-delete browser-style" type="button">Delete</button>
            </div>
            <textarea class="browser-style" disabled spellcheck="false" autocomplete="off" aria-label="Toolbox source"></textarea>
        </div>
    </section>
</body>
</html>
