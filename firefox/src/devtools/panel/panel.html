<!doctype html>
<html lang="en" class="theme-dark">
<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="./panel.css">
    <script defer src="./panel.js"></script>
</head>
<body>
    <main>
        <div id="message-toolbar">
            <button id="btn-clear" type="button">Clear</button>
            <button id="btn-shrink" type="button">Collapse</button>
            <button id="btn-expand" type="button">Expand</button>
            <div class="spacer"></div>
            <input id="filter" type="search" placeholder="Filter messages" aria-label="Filter messages">
            <label><input id="filter-regex" type="checkbox"> Regex</label>
        </div>
        <div id="message-table">
            <div class="row table-header">
                <span>Id</span>
                <span>Origin</span>
                <span>Destination</span>
                <span>Message</span>
                <span>Time</span>
            </div>
            <div id="message-list"></div>
        </div>
    </main>
</body>
</html>
