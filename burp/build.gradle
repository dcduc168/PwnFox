plugins {
    id 'java'
}

group = 'io.github.dcduc168.pwnfox'

repositories {
    mavenCentral()
}

def montoyaApiVersion = '2026.7'

dependencies {
    compileOnly "net.portswigger.burp.extensions:montoya-api:${montoyaApiVersion}"

    testImplementation "net.portswigger.burp.extensions:montoya-api:${montoyaApiVersion}"
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking {
    lockAllConfigurations()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    archiveBaseName = 'pwnfox-burp'
    manifest {
        attributes(
            'Implementation-Title': 'PwnFox',
            'Implementation-Version': project.version
        )
    }
}
