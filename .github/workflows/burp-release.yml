name: Release Burp extension
run-name: Release Burp extension ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "burp-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example, burp-v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: burp-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PROJECT_DIR: burp

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_filename: ${{ steps.metadata.outputs.artifact_filename }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      extension_version: ${{ steps.metadata.outputs.extension_version }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -Eeuo pipefail

          extension_version="$(sed -n 's/^version=//p' "$PROJECT_DIR/gradle.properties")"
          expected_tag="burp-v${extension_version}"

          if [[ -z "$extension_version" || "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Tag '$RELEASE_TAG' does not match Burp extension version '$extension_version' (expected '$expected_tag')."
            exit 1
          fi

          {
            echo "artifact_filename=pwnfox-burp-${extension_version}.jar"
            echo "artifact_name=pwnfox-burp-${extension_version}"
            echo "extension_version=$extension_version"
          } >> "$GITHUB_OUTPUT"

      - name: Test and build extension
        working-directory: burp
        run: ./gradlew --no-daemon clean check jar

      - name: Verify extension artifact
        env:
          ARTIFACT_FILENAME: ${{ steps.metadata.outputs.artifact_filename }}
        run: |
          set -Eeuo pipefail

          artifact="$PROJECT_DIR/build/libs/$ARTIFACT_FILENAME"
          test -s "$artifact"
          jar tf "$artifact" | grep -Fxq 'io/github/dcduc168/pwnfox/PwnFoxExtension.class'

          if jar tf "$artifact" | grep -q '^burp/api/montoya/'; then
            echo "::error::The compile-only Montoya API must not be bundled in the extension JAR."
            exit 1
          fi

      - name: Generate checksum
        env:
          ARTIFACT_FILENAME: ${{ steps.metadata.outputs.artifact_filename }}
        working-directory: burp/build/libs
        run: sha256sum -- "$ARTIFACT_FILENAME" > "$ARTIFACT_FILENAME.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            burp/build/libs/${{ steps.metadata.outputs.artifact_filename }}
            burp/build/libs/${{ steps.metadata.outputs.artifact_filename }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: burp-artifacts

      - name: Create or update release
        env:
          ARTIFACT_FILENAME: ${{ needs.build.outputs.artifact_filename }}
          EXTENSION_VERSION: ${{ needs.build.outputs.extension_version }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -Eeuo pipefail

          artifacts=(
            "burp-artifacts/$ARTIFACT_FILENAME"
            "burp-artifacts/$ARTIFACT_FILENAME.sha256"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${artifacts[@]}" \
              --generate-notes \
              --title "PwnFox for Burp v$EXTENSION_VERSION" \
              --verify-tag
          fi
