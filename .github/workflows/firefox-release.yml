name: Release Firefox extension
run-name: Release Firefox extension ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "firefox-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example, firefox-v1.0.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firefox-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  SOURCE_DIR: firefox

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_filename: ${{ steps.metadata.outputs.artifact_filename }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      extension_version: ${{ steps.metadata.outputs.extension_version }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Verify release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -Eeuo pipefail

          extension_version="$(jq -er '.version | select(type == "string" and length > 0)' "$SOURCE_DIR/manifest.json")"
          expected_tag="firefox-v${extension_version}"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Tag '$RELEASE_TAG' does not match manifest version '$extension_version' (expected '$expected_tag')."
            exit 1
          fi

          {
            echo "artifact_filename=pwnfox-firefox-${extension_version}.zip"
            echo "artifact_name=pwnfox-firefox-${extension_version}"
            echo "extension_version=$extension_version"
          } >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint extension
        run: npm run lint:firefox

      - name: Build extension
        env:
          ARTIFACT_FILENAME: ${{ steps.metadata.outputs.artifact_filename }}
        run: npm run build:firefox -- --filename "$ARTIFACT_FILENAME"

      - name: Generate checksum
        env:
          ARTIFACT_FILENAME: ${{ steps.metadata.outputs.artifact_filename }}
        working-directory: web-ext-artifacts
        run: sha256sum -- "$ARTIFACT_FILENAME" > "$ARTIFACT_FILENAME.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            web-ext-artifacts/${{ steps.metadata.outputs.artifact_filename }}
            web-ext-artifacts/${{ steps.metadata.outputs.artifact_filename }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: web-ext-artifacts

      - name: Create or update release
        env:
          ARTIFACT_FILENAME: ${{ needs.build.outputs.artifact_filename }}
          EXTENSION_VERSION: ${{ needs.build.outputs.extension_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -Eeuo pipefail

          artifacts=(
            "web-ext-artifacts/$ARTIFACT_FILENAME"
            "web-ext-artifacts/$ARTIFACT_FILENAME.sha256"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${artifacts[@]}" \
              --generate-notes \
              --title "PwnFox for Firefox v$EXTENSION_VERSION" \
              --verify-tag
          fi
